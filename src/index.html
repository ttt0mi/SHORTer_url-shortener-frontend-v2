<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Landing - SHORTer</title>
        <link rel="stylesheet" href="./styles/index.css">
        <script src="https://kit.fontawesome.com/7a4373bc0e.js" crossorigin="anonymous"></script>
    </head>

    <body>
        <header>
            <nav class="nav-options">
                <input type="checkbox" id="check">
                <label for="check" class="open-stack-btn">
                    <i class="fas fa-bars"></i>
                </label>
                <label class="logo">SHORTer</label>
                <ul>
                    <li><a class="active" href="#">Home</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Contact</a></li>
                    <li><button class="login-btn-popup">Login</button></li>
                </ul>
            </nav>
        </header>

        <main>
            <div class="cover-box">
                <span class="icon-close">
                    <ion-icon name="close-outline"></ion-icon>
                </span>

                <div class="form-box login">
                    <h2>Login</h2>
                    <form action="#" id="login-form">
                        <div class="input-box">
                            <input type="text" name="user_email" required>
                            <label>Email</label>
                            <span class="icon">
                                <ion-icon name="mail-unread-outline"></ion-icon>
                            </span>
                        </div>
                        <div class="input-box">
                            <input type="password" name="user_password" required>
                            <label>Password</label>
                            <span class="icon">
                                <ion-icon name="lock-closed-outline"></ion-icon>
                            </span>
                        </div>
                        <!--<div class="remember-forgot">
                            <label><input type="checkbox">Remember me</label>
                            <a href="#">Forgot Password</a>
                        </div>-->
                        <button type="submit" class="btn">Login</button>
                        <div class="login-register">
                            <p>Don't have an account? <a href="#" class="register-link">Register</a></p>
                        </div>
                    </form>
                </div>

                <div class="form-box register">
                    <h2>Register</h2>
                    <form action="#" id="registration-form">
                        <div class="input-box">
                            <input type="text" name="first_name"required>
                            <label>First Name</label>
                            <span class="icon">
                                <ion-icon name="person-outline"></ion-icon>
                            </span>
                        </div>
                        <div class="input-box">
                            <input type="text" name="last_name"required>
                            <label>Last Name</label>
                            <span class="icon">
                                <ion-icon name="person-outline"></ion-icon>
                            </span>
                        </div>
                        <div class="input-box">
                            <input type="text" name="email" required>
                            <label>Email</label>
                            <span class="icon">
                                <ion-icon name="mail-unread-outline"></ion-icon>
                            </span>
                        </div>
                        <div class="input-box">
                            <input type="password" name="password" required>
                            <label>Password</label>
                            <span class="icon">
                                <ion-icon name="lock-closed-outline"></ion-icon>
                            </span>
                        </div>
                        <!--<div class="remember-forgot">
                            <label><input type="checkbox">Agree to Ts&Cs</label>
                        </div>-->
                        <button type="submit" class="btn">Register</button>
                        <div class="login-register">
                            <p>Already have an account? <a href="#" class="login-link">Login</a></p>
                        </div>
                    </form>
                </div>
            </div>
        </main>
        
        <footer>
            <div>
                <p>&copy; 2026 SHORTer</p>
                <div class="social-icons"></div>
            </div>
        </footer>

        <script type="module" src="./js/index.js"></script>
        <!--
            The following script tags load Ionicons for both modern and legacy browsers:
            - The 'type="module"' script is for modern browsers supporting ES modules.
            - The 'nomodule' script is for older browsers that do not support ES modules.
        -->
        <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
        <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    </body>
</html>
